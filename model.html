<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model — Power Code Performance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a class="logo-wrap" href="index.html">
        <img src="images/logo.png" alt="Power Code Performance" />
        <span class="tagline">by PitStop</span>
      </a>
      <nav>
        <a href="index.html">Brands</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="breadcrumb" id="breadcrumb">
      <a href="index.html">Brands</a>
      <span>›</span>
      <a href="#" id="breadcrumbBrand">Brand</a>
      <span>›</span>
      <span id="breadcrumbModel">Model</span>
    </div>

    <div id="modelHero"></div>

    <!-- STAGE TABS -->
    <div class="tabs" id="stageTabs"></div>

    <!-- STAGE PANELS -->
    <div id="stagePanels"></div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-logo"><img src="images/logo.png" alt="PCP" /></div>
      <div class="footer-copy">&copy; 2024 <span>Power Code Performance</span> — by PitStop. All rights reserved.</div>
    </div>
  </footer>

  <!-- WHATSAPP FLOAT -->
  <a class="whatsapp-float" href="https://wa.me/972549326225" target="_blank" title="Chat on WhatsApp">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="white" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2C8.268 2 2 8.268 2 16c0 2.46.643 4.767 1.77 6.77L2 30l7.44-1.74A13.94 13.94 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm0 25.6a11.55 11.55 0 01-5.9-1.61l-.42-.25-4.42 1.03 1.06-4.3-.28-.44A11.56 11.56 0 014.4 16c0-6.4 5.2-11.6 11.6-11.6S27.6 9.6 27.6 16 22.4 27.6 16 27.6zm6.36-8.68c-.35-.17-2.07-1.02-2.39-1.14-.32-.12-.55-.17-.78.17-.23.35-.9 1.14-1.1 1.37-.2.23-.4.26-.75.09-.35-.17-1.48-.55-2.82-1.74-1.04-.93-1.74-2.08-1.95-2.43-.2-.35-.02-.54.15-.71.16-.16.35-.4.52-.6.17-.2.23-.35.35-.58.12-.23.06-.43-.03-.6-.09-.17-.78-1.88-1.07-2.57-.28-.68-.57-.58-.78-.59h-.66c-.23 0-.6.09-.91.43-.32.35-1.2 1.17-1.2 2.86s1.23 3.32 1.4 3.55c.17.23 2.42 3.7 5.87 5.19.82.35 1.46.56 1.96.72.82.26 1.57.22 2.16.13.66-.1 2.07-.85 2.36-1.66.29-.82.29-1.52.2-1.66-.08-.14-.31-.23-.66-.4z"/>
    </svg>
  </a>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const modelId = params.get('model');

    loadData().then(data => {
      const model = data.models.find(m => m.model_id === modelId);
      if (!model) {
        document.getElementById('stagePanels').innerHTML = '<div class="empty-state"><h3>Model not found</h3><p><a href="index.html" style="color:var(--red)">← Back to brands</a></p></div>';
        return;
      }

      const brand = data.brands.find(b => b.brand_id === model.brand_id) || {};
      const engine = data.engines[model.engine_id] || {};
      const stageData = data.stages[model.engine_id] || {};

      document.title = `${brand.brand_name || ''} ${model.model_name} — Power Code Performance`;

      // Breadcrumb
      document.getElementById('breadcrumbBrand').textContent = brand.brand_name || 'Brand';
      document.getElementById('breadcrumbBrand').href = `brand.html?brand=${encodeURIComponent(model.brand_id)}`;
      document.getElementById('breadcrumbModel').textContent = model.model_name;

      // Hero
      const yearRange = model.year_from ? `${model.year_from}${model.year_to ? ' – ' + model.year_to : '+'}` : '';
      const photoHtml = model.photo_file
        ? `<img src="images/models/${model.photo_file}" alt="${model.model_name}" onerror="this.parentElement.innerHTML='<div style=\\'padding:40px;text-align:center;color:var(--muted)\\'>No photo available</div>'" />`
        : `<div style="padding:60px;text-align:center;color:var(--muted)">No photo available</div>`;

      document.getElementById('modelHero').innerHTML = `
        <div class="model-hero">
          <div class="model-hero-image">${photoHtml}</div>
          <div class="model-hero-info">
            <div class="brand-label">${brand.brand_name || ''}</div>
            <h2>${model.model_name}</h2>
            <div class="engine-name">${engine.engine_name || model.engine_id || ''}</div>
            ${yearRange ? `<div class="years">${yearRange}</div>` : ''}
          </div>
        </div>`;

      // Tabs & Panels
      const tabsEl = document.getElementById('stageTabs');
      const panelsEl = document.getElementById('stagePanels');

      [1, 2, 3].forEach(stage => {
        const s = stageData[stage];
        const hasData = s && s.tuned_hp;

        // Tab button
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (stage === 1 ? ' active' : '') + (!hasData ? ' disabled' : '');
        btn.textContent = `Stage ${stage}`;
        btn.dataset.stage = stage;
        if (hasData || true) { // allow clicking all tabs (coming soon shows message)
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`panel-${stage}`).classList.add('active');
          });
        }
        tabsEl.appendChild(btn);

        // Panel content
        const panel = document.createElement('div');
        panel.className = 'tab-panel' + (stage === 1 ? ' active' : '');
        panel.id = `panel-${stage}`;

        if (hasData) {
          const hpGain = s.tuned_hp - s.orig_hp;
          const tqGain = s.tuned_torque - s.orig_torque;

          panel.innerHTML = `
            <div class="specs-grid">
              <div class="specs-card">
                <div class="specs-card-title">Original</div>
                <div class="stat-row">
                  <div class="stat-cell">
                    <div class="stat-label">Power</div>
                    <div class="stat-value">${s.orig_hp}<span class="unit">HP</span></div>
                  </div>
                  <div class="stat-cell">
                    <div class="stat-label">Torque</div>
                    <div class="stat-value">${s.orig_torque}<span class="unit">Nm</span></div>
                  </div>
                </div>
              </div>
              <div class="specs-card tuned">
                <div class="specs-card-title">Stage ${stage} — Tuned</div>
                <div class="stat-row">
                  <div class="stat-cell">
                    <div class="stat-label">Power</div>
                    <div class="stat-value">${s.tuned_hp}<span class="unit">HP</span></div>
                    ${hpGain > 0 ? `<div class="gain-badge">+${hpGain} HP</div>` : ''}
                  </div>
                  <div class="stat-cell">
                    <div class="stat-label">Torque</div>
                    <div class="stat-value">${s.tuned_torque}<span class="unit">Nm</span></div>
                    ${tqGain > 0 ? `<div class="gain-badge">+${tqGain} Nm</div>` : ''}
                  </div>
                </div>
              </div>
            </div>`;
        } else {
          panel.innerHTML = `
            <div class="coming-soon">
              <div class="icon">⚡</div>
              <h3>Stage ${stage} — Coming Soon</h3>
              <p>We're working on this tune. Contact us to be notified when it's available.</p>
              <a class="cta-btn" href="contact.html">Contact Us</a>
            </div>`;
        }

        panelsEl.appendChild(panel);
      });
    });
  </script>
</body>
</html>
