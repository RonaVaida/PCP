<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power Code Performance — by PitStop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a class="logo-wrap" href="index.html">
        <img src="images/logo.png" alt="Power Code Performance" />
        <span class="tagline">by PitStop</span>
      </a>
      <nav>
        <a href="index.html" class="active">Brands</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <div class="hero-strip">
    <h1>Chip <span>Tuning</span> Solutions</h1>
    <p>Select your car brand to explore available ECU remapping stages and performance upgrades.</p>
  </div>

  <!-- MAIN -->
  <main>
    <div class="search-wrap">
      <input class="search-input" type="text" id="searchInput" placeholder="Search brand…" />
    </div>

    <div class="section-title">All Brands</div>

    <div class="brands-grid" id="brandsGrid">
      <div class="loading">Loading brands…</div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-logo"><img src="images/logo.png" alt="PCP" /></div>
      <div class="footer-copy">&copy; 2024 <span>Power Code Performance</span> — by PitStop. All rights reserved.</div>
    </div>
  </footer>

  <!-- WHATSAPP FLOAT -->
  <a class="whatsapp-float" href="https://wa.me/972549326225" target="_blank" title="Chat on WhatsApp">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="white" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2C8.268 2 2 8.268 2 16c0 2.46.643 4.767 1.77 6.77L2 30l7.44-1.74A13.94 13.94 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm0 25.6a11.55 11.55 0 01-5.9-1.61l-.42-.25-4.42 1.03 1.06-4.3-.28-.44A11.56 11.56 0 014.4 16c0-6.4 5.2-11.6 11.6-11.6S27.6 9.6 27.6 16 22.4 27.6 16 27.6zm6.36-8.68c-.35-.17-2.07-1.02-2.39-1.14-.32-.12-.55-.17-.78.17-.23.35-.9 1.14-1.1 1.37-.2.23-.4.26-.75.09-.35-.17-1.48-.55-2.82-1.74-1.04-.93-1.74-2.08-1.95-2.43-.2-.35-.02-.54.15-.71.16-.16.35-.4.52-.6.17-.2.23-.35.35-.58.12-.23.06-.43-.03-.6-.09-.17-.78-1.88-1.07-2.57-.28-.68-.57-.58-.78-.59h-.66c-.23 0-.6.09-.91.43-.32.35-1.2 1.17-1.2 2.86s1.23 3.32 1.4 3.55c.17.23 2.42 3.7 5.87 5.19.82.35 1.46.56 1.96.72.82.26 1.57.22 2.16.13.66-.1 2.07-.85 2.36-1.66.29-.82.29-1.52.2-1.66-.08-.14-.31-.23-.66-.4z"/>
    </svg>
  </a>

  <script src="app.js"></script>
  <script>
    loadData().then(data => {
      const grid = document.getElementById('brandsGrid');
      const searchInput = document.getElementById('searchInput');

      function countModels(brandId) {
        return data.models.filter(m => m.brand_id === brandId).length;
      }

      function renderBrands(brands) {
        if (!brands.length) {
          grid.innerHTML = '<div class="empty-state"><h3>No brands found</h3><p>Try a different search term.</p></div>';
          return;
        }
        grid.innerHTML = brands.map(b => {
          const count = countModels(b.brand_id);
          const logoFile = b.logo_file
            ? `<img class="brand-logo" src="images/brands/${b.logo_file}" alt="${b.brand_name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="brand-logo-placeholder" style="display:none">${b.brand_name.slice(0,3)}</div>`
            : `<div class="brand-logo-placeholder">${b.brand_name.slice(0,3)}</div>`;
          return `
            <a class="brand-card" href="brand.html?brand=${encodeURIComponent(b.brand_id)}">
              ${logoFile}
              <div class="brand-name">${b.brand_name}</div>
              <div class="brand-count">${count} model${count !== 1 ? 's' : ''}</div>
            </a>`;
        }).join('');
      }

      renderBrands(data.brands);

      searchInput.addEventListener('input', () => {
        const q = searchInput.value.toLowerCase();
        renderBrands(data.brands.filter(b => b.brand_name.toLowerCase().includes(q)));
      });
    });
  </script>
</body>
</html>
